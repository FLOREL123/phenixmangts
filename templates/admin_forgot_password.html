{% extends "base.html" %}

{% block title %}Mot de passe admin oublié{% endblock %}

{% block content %}
<div style="max-width:400px;margin:40px auto;">
    <div class="card">
        <div class="card-header">
            <h2>🔐 Récupération admin</h2>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth.admin_forgot_password') }}">
                <div class="form-group">
                    <label>Quelle est votre couleur préférée ?</label>
                    <input type="text" name="answer" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Nouveau mot de passe</label>
                    <input type="password" name="new_password" minlength="8" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirmer le nouveau mot de passe</label>
                    <input type="password" name="confirm_password" minlength="8" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
                    Modifier le mot de passe
                </button>
            </form>
            <div style="margin-top:16px;text-align:center;">
                <a href="{{ url_for('auth.admin_login') }}" style="color:var(--primary);">Retour à la connexion</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
