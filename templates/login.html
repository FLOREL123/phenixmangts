{% extends "base.html" %}

{% block title %}Connexion - PHENIX MANAGEMENT{% endblock %}

{% block content %}
<div style="max-width:400px;margin:40px auto;">
    <div class="card">
        <div class="card-header">
            <h2>🔐 Connexion</h2>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" name="password" placeholder="Votre mot de passe" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
                    Se connecter
                </button>
            </form>
            <div style="margin-top:16px;text-align:center;font-size:0.85rem;color:var(--ink-soft);">
                <p>Pas encore de compte ? <a href="{{ url_for('auth.register') }}" style="color:var(--primary);">📝 Créer un compte</a></p>
                <p style="margin-top:8px;">
                    <a href="{{ url_for('auth.admin_login') }}" style="color:var(--primary);">🔐 Accès administrateur</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
