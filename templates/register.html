{% extends "base.html" %}

{% block title %}Inscription - PHENIX MANAGEMENT{% endblock %}

{% block content %}
<div style="max-width:600px;margin:20px auto;">
    <div class="card">
        <div class="card-header">
            <h2>📝 Créer un compte</h2>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <!-- Informations personnelles -->
                <h3 style="font-size:1rem;color:var(--primary);margin-bottom:12px;">👤 Informations personnelles</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Nom *</label>
                        <input type="text" name="nom" required placeholder="Votre nom">
                    </div>
                    <div class="form-group">
                        <label>Prénom *</label>
                        <input type="text" name="prenom" required placeholder="Votre prénom">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" required placeholder="votre@email.com">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Mot de passe *</label>
                        <input type="password" name="password" required placeholder="Minimum 4 caractères">
                    </div>
                    <div class="form-group">
                        <label>Confirmer le mot de passe *</label>
                        <input type="password" name="confirm_password" required placeholder="Confirmez">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Téléphone</label>
                        <input type="text" name="telephone" placeholder="+229 00 00 00 00">
                    </div>
                    <div class="form-group">
                        <label>Genre</label>
                        <select name="genre">
                            <option value="M.">M.</option>
                            <option value="Mme">Mme</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Adresse</label>
                    <input type="text" name="adresse" placeholder="Votre adresse">
                </div>
                
                <!-- Informations scolaires -->
                <h3 style="font-size:1rem;color:var(--primary);margin:20px 0 12px;">🏫 Informations scolaires</h3>
                
                <div class="form-group">
                    <label>École / Université *</label>
                    <input type="text" name="ecole" required placeholder="Nom de votre établissement">
                </div>
                
                <div class="form-group">
                    <label>Niveau d'étude *</label>
                    <select name="niveau_etude" required>
                        <option value="">-- Sélectionnez --</option>
                        <option value="Bac">Bac</option>
                        <option value="Licence 1">Licence 1</option>
                        <option value="Licence 2">Licence 2</option>
                        <option value="Licence 3">Licence 3</option>
                        <option value="Master 1">Master 1</option>
                        <option value="Master 2">Master 2</option>
                        <option value="Doctorat">Doctorat</option>
                        <option value="Autre">Autre</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Numéro des parents / Tuteur *</label>
                    <input type="text" name="telephone_parents" required placeholder="+229 00 00 00 00">
                </div>
                
                <!-- Informations de stage -->
                <h3 style="font-size:1rem;color:var(--primary);margin:20px 0 12px;">📅 Informations de stage</h3>
                
                <div class="form-group">
                    <label>Durée du stage (en mois) *</label>
                    <select name="duree_stage" required>
                        <option value="1">1 mois</option>
                        <option value="2">2 mois</option>
                        <option value="3" selected>3 mois</option>
                        <option value="4">4 mois</option>
                        <option value="5">5 mois</option>
                        <option value="6">6 mois</option>
                        <option value="12">12 mois</option>
                    </select>
                </div>
                
                <div style="margin-top:20px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;">
                    <button type="submit" class="btn btn-primary">✅ Créer mon compte</button>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline">🔐 J'ai déjà un compte</a>
                </div>
            </form>
            <div style="margin-top:16px;text-align:center;font-size:0.85rem;color:var(--ink-soft);">
                <p>📌 Tous les champs marqués d'un * sont obligatoires.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
